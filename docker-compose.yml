services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: alphalab
      POSTGRES_PASSWORD: alphalab
      POSTGRES_DB: alphalab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphalab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
